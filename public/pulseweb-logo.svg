<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="512" height="512" rx="64" fill="#111111"/>

  <!-- Logo icon -->
  <g transform="translate(256, 190)" >
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="130" stroke="url(#logoGrad)" stroke-width="8"/>

    <!-- Pulse wave -->
    <path
      d="M-100 0 L-58 0 L-41 -56 L-18 66 L5 -96 L28 56 L47 -28 L58 0 L100 0"
      stroke="url(#logoGrad)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Inner glow dot -->
    <circle cx="0" cy="0" r="10" fill="#00D4FF" opacity="0.8"/>
  </g>

  <!-- PulseWeb text -->
  <text x="256" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" letter-spacing="-1">
    <tspan fill="url(#textGrad)">Pulse</tspan><tspan fill="#FFFFFF">Web</tspan>
  </text>

  <!-- Technologies text -->
  <text x="256" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6B7280" letter-spacing="6" font-weight="500">TECHNOLOGIES</text>

  <defs>
    <linearGradient id="logoGrad" x1="-130" y1="-130" x2="130" y2="130" gradientUnits="userSpaceOnUse" gradientTransform="translate(256, 190)">
      <stop offset="0%" stop-color="#6C3CE1"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="150" y1="350" x2="300" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C3CE1"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>
</svg>
